<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Добавление оборудования</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:30px}.wrap{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}label{display:block;margin-top:15px;font-weight:bold}input{width:100%;padding:8px;margin-top:4px;box-sizing:border-box}button{margin-top:25px;padding:10px 20px}#status{margin-top:20px;font-weight:bold}.ok{color:green}.err{color:red}</style></head><body><div class='wrap'><h2>Добавление оборудования</h2><form id='equipmentForm'><label>Договор</label><input id='contract_number' required><label>Клиент</label><input id='client_name' required><label>Производитель</label><input id='vendor' required><label>Модель</label><input id='model' required><label>Серийный номер</label><input id='serial_number' required><label>Размер (U)</label><input id='size_u' type='number' min='1' required><label>Помещение</label><input id='room_id' type='number' min='1' required><label>Стойка</label><input id='rack_id' type='number' min='1' required><label>Верхний юнит</label><input id='top_unit' type='number' min='1' required><button type='submit'>Сохранить</button></form><div id='status'></div></div><script>const form=document.getElementById('equipmentForm'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();const data={contract_number:contract_number.value,client_name:client_name.value,vendor:vendor.value,model:model.value,serial_number:serial_number.value,size_u:Number(size_u.value),room_id:Number(room_id.value),rack_id:Number(rack_id.value),top_unit:Number(top_unit.value)};try{const r=await fetch('/api/equipment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text());status.className='ok';status.textContent='Оборудование успешно добавлено.';form.reset();contract_number.focus()}catch(err){status.className='err';status.textContent='Ошибка: '+err.message;}});</script></body></html>
