<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Добавление оборудования</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5}.wrap{max-width:700px;margin:40px auto;background:#fff;padding:24px;border-radius:8px}label{display:block;margin-top:12px;font-weight:bold}input{width:100%;padding:8px;box-sizing:border-box}button{margin-top:20px;padding:10px 18px}#status{margin-top:15px;font-weight:bold}.ok{color:green}.err{color:red}</style></head><body><div class='wrap'><h2>Добавление оборудования</h2><form id='f'><label>Договор</label><input id='contract' required><label>Клиент</label><input id='client' required><label>Производитель</label><input id='vendor' required><label>Модель</label><input id='model' required><label>Серийный номер</label><input id='serial' required><label>Размер (U)</label><input id='size_u' type='number' min='1' required><button type='submit'>Сохранить</button></form><div id='status'></div></div><script>const f=document.getElementById('f'),s=document.getElementById('status');f.addEventListener('submit',async e=>{e.preventDefault();const data={contract:f.contract.value,client:f.client.value,vendor:f.vendor.value,model:f.model.value,serial_number:f.serial.value,size_u:Number(f.size_u.value)};try{const r=await fetch('/equipment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error();s.className='ok';s.textContent='Оборудование успешно добавлено';f.reset();f.contract.focus()}catch{ s.className='err';s.textContent='Ошибка при сохранении';}});</script></body></html>
